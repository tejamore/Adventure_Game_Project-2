<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Quest for the Legendary Treasure{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="scanlines"></div>
  <div class="wrap">
    <header class="game-header">
      <span class="glyph">&#9876;</span>
      <h1>Quest for the Legendary Treasure</h1>
      <span class="glyph">&#128176;</span>
    </header>
    <main class="console">
      {% block content %}{% endblock %}
    </main>
    <footer class="game-footer">Python &middot; Flask &middot; built with GitHub Copilot</footer>
  </div>
</body>
</html>
